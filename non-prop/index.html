<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FundingRock Non-Prop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Preview shell: the non-prop page in a desktop browser frame or a phone frame, same pattern as the 1-Step and Kokuyō prototypes. */
:root { --bg: #03090c; --panel: #08171c; --line: rgba(255,255,255,.1); --fg: #fff; --mute: #a6c4c6; --lime: #d9ff00; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.bar b { font-weight: 600; }
.bar b span { color: var(--mute); font-weight: 400; margin-left: 8px; }
.seg { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
.seg button { appearance: none; border: 0; background: transparent; color: var(--mute); font: inherit; font-size: 13px; font-weight: 500; padding: 7px 16px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--lime); color: #0a0a0a; }
.seg button:focus-visible, a:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
.open { color: var(--fg); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 13px; background: var(--panel); }
.stage { position: relative; overflow: hidden; background: radial-gradient(900px 500px at 50% 0%, rgba(0,216,195,.16), transparent 70%), var(--bg); }
.browser { position: absolute; left: 0; top: 0; transform-origin: 0 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #000; box-shadow: 0 40px 120px -30px rgba(0,0,0,.9); }
.browser .chrome { height: 40px; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: #0a1c21; border-bottom: 1px solid var(--line); }
.dots { display: flex; gap: 7px; } .dots i { width: 11px; height: 11px; border-radius: 50%; background: #333; display: block; }
.url { flex: 1; max-width: 520px; margin: 0 auto; height: 26px; border-radius: 8px; background: #061114; color: var(--mute); font-size: 13px; display: flex; align-items: center; justify-content: center; }
.browser iframe { display: block; width: 1440px; border: 0; background: var(--bg); }
.phone { position: absolute; left: 0; top: 0; width: 420px; height: 880px; transform-origin: 0 0; border-radius: 64px; padding: 14px; background: linear-gradient(145deg, #3a3a3a, #121212 40%, #2a2a2a); box-shadow: 0 0 0 2px #0d0d0d, 0 50px 120px -30px rgba(0,0,0,.95), inset 0 0 0 2px rgba(255,255,255,.08); }
.screen { position: relative; width: 392px; height: 852px; border-radius: 52px; overflow: hidden; background: var(--bg); }
.island { position: absolute; left: 50%; top: 11px; width: 112px; height: 32px; transform: translateX(-50%); background: #000; border-radius: 20px; z-index: 4; }
.sbar { position: absolute; left: 0; right: 0; top: 0; height: 50px; z-index: 3; background: #03090c; display: flex; justify-content: space-between; align-items: center; padding: 6px 30px 0 34px; font-size: 15px; font-weight: 600; }
.phone iframe { position: absolute; left: 0; top: 50px; width: 390px; height: 802px; border: 0; background: var(--bg); }
.bare .phone { border-radius: 0; padding: 0; background: none; box-shadow: none; width: 100%; height: 100%; transform: none !important; }
.bare .screen { width: 100%; height: 100%; border-radius: 0; }
.bare .sbar, .bare .island { display: none; }
.bare .phone iframe { top: 0; width: 100%; height: 100%; }
.tools { display: flex; align-items: center; gap: 10px; }
.edt { cursor: pointer; font: inherit; font-size: 13px; }
.edt[aria-pressed="true"] { background: var(--lime); color: #0a0a0a; border-color: var(--lime); }
.est { font-size: 12px; color: var(--mute); }
@media (max-width: 560px) { .bar { display: none; } .app { grid-template-rows: 1fr; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <b>Non-Prop Traders<span>Landing page</span></b>
    <div class="seg" role="group" aria-label="Preview size"><button id="bDesk" type="button" aria-pressed="true">Desktop</button><button id="bMob" type="button" aria-pressed="false">Mobile</button></div>
    <div class="tools"><span class="est" id="est" aria-live="polite"></span><button class="open edt" id="edt" type="button" aria-pressed="false" hidden>Edit text</button><a class="open" href="site.html" target="_blank" rel="noopener">Open full page</a></div>
  </header>
  <section class="stage" id="stage">
    <div class="browser" id="browser"><div class="chrome"><div class="dots"><i></i><i></i><i></i></div><div class="url">fundingrock.com/start</div><div style="width:50px"></div></div><iframe id="fDesk" title="Non-prop page, desktop" src="site.html"></iframe></div>
    <div class="phone" id="phone" hidden><div class="screen"><div class="sbar"><span>9:41</span><span>●●●</span></div><div class="island"></div><iframe id="fMob" title="Non-prop page, mobile" data-src="site.html"></iframe></div></div>
  </section>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var stage = $("stage"), browser = $("browser"), phone = $("phone"), mode = "desktop";
  function narrow() { return innerWidth <= 560; }
  function fit() {
    var w = stage.clientWidth, h = stage.clientHeight, pad = 20;
    if (mode === "desktop") { var s = Math.min(1, (w - pad * 2) / 1440); $("fDesk").style.height = Math.max(300, Math.floor((h - pad * 2) / s) - 40) + "px"; browser.style.transform = "scale(" + s + ")"; browser.style.left = Math.max(pad, (w - 1440 * s) / 2) + "px"; browser.style.top = pad + "px"; }
    else if (!narrow()) { var s2 = Math.min(1, (h - pad * 2) / 880, (w - pad * 2) / 420); phone.style.transform = "scale(" + s2 + ")"; phone.style.left = Math.max(0, (w - 420 * s2) / 2) + "px"; phone.style.top = Math.max(pad, (h - 880 * s2) / 2) + "px"; }
  }
  function set(m) {
    mode = m; $("bDesk").setAttribute("aria-pressed", m === "desktop"); $("bMob").setAttribute("aria-pressed", m === "mobile");
    browser.hidden = m !== "desktop"; phone.hidden = m !== "mobile";
    if (m === "mobile" && !$("fMob").getAttribute("src")) $("fMob").setAttribute("src", $("fMob").getAttribute("data-src"));
    $("app").classList.toggle("bare", m === "mobile" && narrow()); fit();
  }
  $("bDesk").addEventListener("click", function () { set("desktop"); });
  $("bMob").addEventListener("click", function () { set("mobile"); });
  addEventListener("resize", function () { set(mode); });
  set(narrow() ? "mobile" : "desktop");
})();

/* Text editing: people who can edit this artifact turn on "Edit text", click any text on the page and type.
   Edits are saved to the artifact's shared database (doc content/text) and shown to every viewer of this preview. */
(function () {
  var frames = [document.getElementById("fDesk"), document.getElementById("fMob")];
  var btn = document.getElementById("edt"), est = document.getElementById("est");
  var map = {}, editing = false, ref = null, timer = 0, saving = false, again = false, pend = false;
  function post(win, m) { try { win.postMessage(m, "*"); } catch (e) {} }
  function all(m) { frames.forEach(function (f) { if (f.contentWindow) post(f.contentWindow, m); }); }
  function status(t) { est.textContent = t; }
  addEventListener("message", function (e) {
    var d = e.data; if (!d || d.fr !== "np") return;
    if (!frames.some(function (f) { return f.contentWindow === e.source; })) return;
    if (d.t === "ready") { post(e.source, { fr: "np", t: "ov", map: map }); post(e.source, { fr: "np", t: "edit", on: editing }); }
    if (d.t === "chg" && editing && ref && typeof d.k === "string" && typeof d.html === "string" && d.html.length < 4000) {
      map[d.k] = d.html; pend = true; status("Saving…"); clearTimeout(timer); timer = setTimeout(save, 700);
    }
  });
  function save() {
    if (saving) { again = true; return; }
    saving = true; pend = false;
    var copy = {}; for (var k in map) copy[k] = map[k];
    ref.set({ map: copy, updatedAt: Date.now() }).then(function () { status("Saved"); }, function () { status("Not saved: you may not have edit access"); })
      .then(function () { saving = false; if (again) { again = false; save(); } });
  }
  btn.addEventListener("click", function () {
    editing = !editing; btn.setAttribute("aria-pressed", editing); btn.textContent = editing ? "Done editing" : "Edit text";
    status(editing ? "Click any text to edit it" : ""); all({ fr: "np", t: "edit", on: editing });
  });
  if (!window.claude || !window.claude.use) return;
  Promise.all([claude.use("db"), claude.use("user")]).then(function (r) {
    var db = r[0], user = r[1]; if (!db) return;
    ref = db.doc("content/text");
    ref.onSnapshot(function (s) { if (pend || saving) return; var d = s.exists ? s.data() : null; map = {}; if (d && d.map) for (var k in d.map) map[k] = d.map[k]; all({ fr: "np", t: "ov", map: map }); }, function () {});
    if (user) user.canEdit().then(function (ok) { if (ok) btn.hidden = false; });
  });
})();
</script>
</body>
</html>
