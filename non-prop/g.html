<meta charset="utf-8">
<title>FundingRock Instant · Hero G</title>
<style>
/* Hero G on its own: the landing page fills the frame at its real size, nothing around it. */
:root { --bg: #03090c; color-scheme: dark; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); overflow: hidden; }
iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }
</style>
<iframe id="f" title="FundingRock Instant landing page, Hero G" src="site.html?hero=g"></iframe>
<script>
(function () {
  var f = document.getElementById("f");
  /* tell the page it is inside a frame (hides its version switcher) and pin Hero G */
  function pin() { try { f.contentWindow.postMessage({ fr: "np", t: "hero", v: "g" }, "*"); } catch (e) {} }
  addEventListener("message", function (e) { if (e.source === f.contentWindow && e.data && e.data.fr === "np" && e.data.t === "ready") pin(); });
  f.addEventListener("load", pin);
})();
</script>
