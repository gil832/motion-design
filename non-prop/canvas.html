<meta charset="utf-8">
<title>Hero Canvas E · G · H</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400..700&display=swap">
<style>
/* Layout: three live pages side by side on the page's own teal-black, each scaled to its column and scrollable on its own. Single dark look. */
:root { --bg: #03090c; --panel: #071417; --line: rgba(255,255,255,.09); --ink: #fff; --mute: rgba(255,255,255,.6); --lime: #d9ff00; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: radial-gradient(1200px 600px at 50% -10%, rgba(0,216,195,.12), transparent 70%), var(--bg); color: var(--ink); font-family: "Host Grotesk", "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.bar b { font-size: 15px; font-weight: 600; } .bar b span { color: var(--mute); font-weight: 400; margin-left: 8px; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); }
.seg button { appearance: none; border: 0; background: none; color: var(--mute); font: inherit; font-size: 13px; font-weight: 600; padding: 7px 16px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--lime); color: #0a0c02; }
.seg button:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(14px, 2vw, 28px); padding: 20px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); min-height: 0; }
.col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.col h2 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; font-size: 15px; font-weight: 600; }
.col h2 i { font-style: normal; display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; }
.col.new h2 i { background: var(--lime); color: #0a0c02; border-color: var(--lime); }
.col h2 small { font-weight: 400; color: var(--mute); font-size: 13px; }
.frame { position: relative; flex: 1; min-height: 0; border-radius: 16px 16px 0 0; overflow: hidden; border: 1px solid var(--line); border-bottom: 0; background: var(--bg); box-shadow: 0 30px 80px -40px rgba(0,0,0,.9); }
.frame iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: var(--bg); }
@media (max-width: 760px) {
  body { overflow: auto; } .app { height: auto; }
  .board { grid-template-columns: 1fr; }
  .frame { height: 78vh; flex: none; border-radius: 16px; border-bottom: 1px solid var(--line); }
}
.col h2 { align-items: center; }
.fz { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--mute); font: inherit; font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 999px; cursor: pointer; transition: color .25s, border-color .25s; }
.fz svg { width: 14px; height: 14px; }
.op { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--mute); text-decoration: none; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); }
.op:hover, .op:focus-visible { color: var(--ink); border-color: var(--lime); outline: none; }
.op + .fz { margin-left: 8px; }
.board.focus .op { margin-left: auto; }
.fz:hover, .fz:focus-visible { color: #0a0c02; background: var(--lime); border-color: var(--lime); outline: none; }
.all { appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 999px; cursor: pointer; margin-left: auto; }
.all:hover, .all:focus-visible { border-color: var(--lime); outline: none; }
.board.focus { grid-template-columns: minmax(0, 1fr); }
.board.focus .col:not(.on) { display: none; }
.board.focus .fz { display: none; }
.hit { position: absolute; inset: 0; z-index: 2; appearance: none; border: 0; padding: 0; background: transparent; cursor: zoom-in; }
.hit:focus-visible { outline: 2px solid var(--lime); outline-offset: -2px; }
.board.focus .hit { display: none; }
.frame { cursor: zoom-in; }
.board.focus .frame { cursor: auto; }
.col h2 { transition: opacity .3s; }
</style>

<div class="app">
  <header class="bar">
    <b>Non-Prop Traders<span>Hero comparison</span></b>
    <button type="button" class="all" id="bAll" hidden>← All three</button>
    <div class="seg" role="group" aria-label="Preview size"><button type="button" id="bD" aria-pressed="true">Desktop</button><button type="button" id="bM" aria-pressed="false">Mobile</button></div>
  </header>
  <main class="board">
    <section class="col"><h2><i>E</i>Hero E <small>Current reveal hero</small><button type="button" class="fz" data-k="1" aria-label="Focus this version"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Focus</span></button></h2><div class="frame"><iframe title="Hero E" data-h="e" src="site.html?hero=e"></iframe></div></section>
    <section class="col"><h2><i>G</i>Hero G <small>Current, with promo banner</small><button type="button" class="fz" data-k="2" aria-label="Focus this version"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Focus</span></button></h2><div class="frame"><iframe title="Hero G" data-h="g" src="site.html?hero=g"></iframe></div></section>
    <section class="col new"><h2><i>H</i>Hero H <small>G with The Trading Identity</small><button type="button" class="fz" data-k="3" aria-label="Focus this version"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Focus</span></button></h2><div class="frame"><iframe title="Hero H" data-h="h" src="site.html?hero=h"></iframe></div></section>
  </main>
</div>

<script>
(function () {
  var frames = [].slice.call(document.querySelectorAll(".frame iframe")), mode = "d";
  function fit() {
    var W = mode === "d" ? 1440 : 390;
    frames.forEach(function (f) {
      /* never zoom past 100%: wider boxes get a wider (real) page, narrower ones a scaled-down 1440 page */
      var box = f.parentNode, Wd = mode === "d" ? Math.max(W, box.clientWidth) : W, s = Math.min(1, box.clientWidth / Wd);
      f.style.width = Wd + "px"; f.style.height = Math.ceil(box.clientHeight / s) + "px"; f.style.transform = "scale(" + s + ")"; f.style.left = Math.max(0, (box.clientWidth - Wd * s) / 2) + "px";
    });
  }
  /* tell each page it is inside a preview, so it hides its own floating version switcher, and pin its hero */
  addEventListener("message", function (e) { var d = e.data; if (!d || d.fr !== "np" || d.t !== "ready") return;
    frames.forEach(function (f) { if (f.contentWindow === e.source) f.contentWindow.postMessage({ fr: "np", t: "hero", v: f.getAttribute("data-h") }, "*"); }); });
  frames.forEach(function (f) { f.addEventListener("load", function () { try { f.contentWindow.postMessage({ fr: "np", t: "hero", v: f.getAttribute("data-h") }, "*"); } catch (er) {} }); });
  var board = document.querySelector(".board"), cols = [].slice.call(document.querySelectorAll(".col")), all = document.getElementById("bAll");
  function focus(i) {
    cols.forEach(function (c, j) { c.classList.toggle("on", j === i); });
    board.classList.toggle("focus", i >= 0); all.hidden = i < 0; fit();
    try { location.hash = i >= 0 ? ["e", "g", "h"][i] : ""; } catch (er) {}
  }
  [].forEach.call(document.querySelectorAll(".fz"), function (b) { b.addEventListener("click", function () { focus(+b.getAttribute("data-k") - 1); }); });
  all.addEventListener("click", function () { focus(-1); });
  addEventListener("keydown", function (e) { if (e.key === "Escape") focus(-1); if (e.key === "1" || e.key === "2" || e.key === "3") focus(+e.key - 1); });
  /* the iframes swallow clicks, so a thin overlay on each frame catches "click to focus" while all three are showing */
  cols.forEach(function (c, i) { var o = document.createElement("button"); o.type = "button"; o.className = "hit"; o.setAttribute("aria-label", "Focus " + c.querySelector("h2").firstChild.nextSibling.textContent.trim()); o.addEventListener("click", function () { focus(i); }); c.querySelector(".frame").appendChild(o); });
  var h0 = (location.hash || "").replace("#", ""), k0 = ["e", "g", "h"].indexOf(h0); if (k0 >= 0) setTimeout(function () { focus(k0); }, 0);
  function set(m) { mode = m; document.getElementById("bD").setAttribute("aria-pressed", m === "d"); document.getElementById("bM").setAttribute("aria-pressed", m === "m"); fit(); }
  document.getElementById("bD").addEventListener("click", function () { set("d"); });
  document.getElementById("bM").addEventListener("click", function () { set("m"); });
  addEventListener("resize", fit); set(innerWidth < 760 ? "m" : "d");
})();
</script>
