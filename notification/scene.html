<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FundingRock Notification</title>
<style>
  :root { --lime: #d6f21d; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  body { font-family: "Inter", sans-serif; -webkit-font-smoothing: antialiased; }

  #stage { position: absolute; inset: 0; overflow: hidden;
    background: radial-gradient(120% 70% at 50% 40%, #0d1a13 0%, #050907 55%, #000 100%); }
  #glow { position: absolute; left: 50%; top: 42%; width: 1200px; height: 1200px;
    margin: -600px 0 0 -600px; border-radius: 50%;
    background: radial-gradient(circle, rgba(214,242,29,.22) 0%, rgba(214,242,29,.06) 35%, rgba(0,0,0,0) 65%); }
  #grid { position: absolute; inset: -200px; opacity: .10;
    background-image: linear-gradient(rgba(255,255,255,.6) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.6) 1px, transparent 1px);
    background-size: 108px 108px;
    -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 60%); }

  #camera { position: absolute; inset: 0; transform-origin: 540px 640px; }
  #persp { position: absolute; inset: 0; perspective: 2400px; perspective-origin: 540px 800px; }
  /* Rig: hand + phone. Phone occupies (170,240)-(910,1760) in rig space. */
  #rig { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px;
    transform-origin: 540px 1500px; transform-style: preserve-3d; }
  .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 2400px; overflow: visible; }

  #phone { position: absolute; left: 170px; top: 240px; width: 740px; height: 1520px; border-radius: 118px;
    background: linear-gradient(135deg, #5d6266 0%, #2a2d30 18%, #16181a 50%, #2c2f32 82%, #6a6f73 100%);
    box-shadow: 0 60px 120px rgba(0,0,0,.75), 0 0 0 2px #0a0b0c, inset 0 0 0 2px rgba(255,255,255,.12); }
  #phone .btn { position: absolute; background: linear-gradient(90deg,#3a3d40,#1c1e20); border-radius: 4px; }
  #bezel { position: absolute; left: 12px; top: 12px; right: 12px; bottom: 12px; border-radius: 106px; background: #000; }
  #screen { position: absolute; left: 26px; top: 26px; right: 26px; bottom: 26px; border-radius: 94px; overflow: hidden;
    background: radial-gradient(90% 55% at 70% 18%, #1e3a2b 0%, rgba(0,0,0,0) 70%),
                radial-gradient(80% 50% at 20% 85%, #18301f 0%, rgba(0,0,0,0) 70%),
                linear-gradient(180deg, #0f2219 0%, #0a1712 50%, #050c09 100%); }
  #wake { position: absolute; inset: 0; background: #000; }
  #island { position: absolute; left: 50%; top: 30px; width: 210px; height: 62px; margin-left: -105px;
    border-radius: 31px; background: #000; z-index: 5; }
  #status { position: absolute; left: 0; right: 0; top: 40px; height: 44px; padding: 0 70px 0 82px;
    display: flex; justify-content: space-between; align-items: center; color: #fff; font-weight: 600; font-size: 28px; }
  #status .icons { display: flex; gap: 12px; align-items: center; }
  #clock { position: absolute; left: 0; right: 0; top: 150px; text-align: center; color: rgba(235,245,238,.92); }
  #clock .date { font-size: 32px; font-weight: 600; letter-spacing: .2px; }
  #clock .time { font-family: "Inter Display"; font-size: 200px; font-weight: 600; line-height: 1; letter-spacing: -4px; margin-top: 4px; }
  #bottomBar { position: absolute; left: 50%; bottom: 22px; width: 250px; height: 9px; margin-left: -125px; border-radius: 5px; background: rgba(255,255,255,.85); }
  .qbtn { position: absolute; bottom: 92px; width: 96px; height: 96px; border-radius: 50%;
    background: rgba(255,255,255,.12); backdrop-filter: blur(20px); display: grid; place-items: center; }

  #notif { position: absolute; left: 22px; right: 22px; top: 560px; height: 214px; border-radius: 52px;
    background: rgba(105,112,108,.55); backdrop-filter: blur(30px) saturate(140%);
    box-shadow: 0 20px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.10);
    transform-origin: 50% 0; }
  #notif .icon { position: absolute; left: 30px; top: 46px; width: 86px; height: 86px; border-radius: 22px; background: #050505;
    box-shadow: 0 0 0 1px rgba(255,255,255,.06); }
  #notif .app { position: absolute; left: 140px; top: 36px; font-size: 25px; font-weight: 600; letter-spacing: .8px; color: rgba(255,255,255,.88); }
  #notif .now { position: absolute; right: 34px; top: 30px; font-size: 25px; font-weight: 500; color: rgba(255,255,255,.62); }
  #notif .l1 { position: absolute; left: 140px; top: 76px; font-family: "Inter Display"; font-size: 41px; font-weight: 700; color: #fff; letter-spacing: -.3px; white-space: nowrap; }
  #notif .l2 { position: absolute; left: 140px; top: 128px; font-family: "Inter Display"; font-size: 44px; font-weight: 800; color: var(--lime); letter-spacing: -.3px; white-space: nowrap; }
  .w { display: inline-block; will-change: transform, opacity, filter; }
  #sheen { position: absolute; inset: 0; border-radius: 52px; overflow: hidden; pointer-events: none; }
  #sheen div { position: absolute; top: -50%; width: 160px; height: 200%;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.16), rgba(255,255,255,0)); transform: rotate(20deg); }
  #screenGlare { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.06) 42%, rgba(255,255,255,0) 52%); }
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(75% 60% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.65) 100%); }
  #fade { position: absolute; inset: 0; background: #000; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <div id="glow"></div>
  <div id="camera"><div id="persp"><div id="rig">

    <!-- Hand, behind the phone: palm, wrist, finger bases -->
    <svg class="layer" viewBox="0 0 1080 2400">
      <defs>
        <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#d79a78"/><stop offset=".55" stop-color="#b8765a"/><stop offset="1" stop-color="#6e3f2d"/>
        </linearGradient>

            <svg width="52" height="24" viewBox="0 0 52 24"><rect x="1" y="1" width="44" height="22" rx="7" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2"/><rect x="4" y="4" width="34" height="16" rx="4.5" fill="#fff"/><rect x="47" y="8" width="3.5" height="8" rx="1.5" fill="rgba(255,255,255,.5)"/></svg>
          </span>
        </div>
        <div id="clock">
          <div class="date">Tuesday, November 10</div>

          <div class="icon">
            <svg viewBox="0 0 100 100" width="86" height="86">
              <!-- FR mark: lightning-cut F + R -->
              <path fill="#d6f21d" d="M 20 22 L 49 22 L 44 36 L 36 36 L 31 48 L 40 48 L 22 80 L 26 56 L 20 56 Z"/>
              <path fill="#d6f21d" fill-rule="evenodd" d="M 52 22 L 66 22 C 79 22 84 30 84 39 C 84 47 79 52 73 54 L 85 76 L 70 76 L 60 57 L 60 76 L 52 76 Z
                       M 60 31 L 60 47 L 66 47 C 72 47 75 44 75 39 C 75 34 72 31 66 31 Z"/>
            </svg>
          </div>
          <div class="app" id="appName">FUNDINGROCK</div>
          <div class="now" id="nowLbl">now</div>
          <div class="l1" id="l1"></div>
          <div class="l2" id="l2"></div>
          <div id="sheen"><div></div></div>
        </div>

        <div class="qbtn" style="left:70px">
          <svg width="40" height="44" viewBox="0 0 40 44"><path d="M14 2h12v10l6 8v20a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V20l6-8z" fill="#fff"/></svg>
        </div>
        <div class="qbtn" style="right:70px">
          <svg width="46" height="38" viewBox="0 0 46 38"><path d="M4 8h9l4-6h12l4 6h9v28H4z" fill="#fff"/><circle cx="23" cy="21" r="8" fill="#555"/></svg>
        </div>
        <div id="bottomBar"></div>
        <div id="screenGlare"></div>
        <div id="wake"></div>
      </div>
    </div>

    <!-- Hand, in front of the phone: fingertips over the left edge, thumb over the right edge -->
    <svg class="layer" viewBox="0 0 1080 2400">
      <defs>
        <linearGradient id="tip" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#9b5d43"/><stop offset=".7" stop-color="#c98c6c"/><stop offset="1" stop-color="#d9a083"/>
        </linearGradient>
        <linearGradient id="thumbG" x1="1" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#7a452f"/><stop offset=".45" stop-color="#b9785a"/><stop offset="1" stop-color="#dba385"/>
        </linearGradient>
        <linearGradient id="nail" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f1cdbb"/><stop offset="1" stop-color="#c99a85"/>
        </linearGradient>
        <linearGradient id="fingerG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#d49a7a"/><stop offset=".55" stop-color="#b47457"/><stop offset="1" stop-color="#7e4733"/>
        </linearGradient>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
      </defs>
      <!-- contact shadows on phone -->
      <g fill="rgba(0,0,0,.55)" filter="url(#soft)">
        <path d="M 930 1500 C 880 1420 820 1330 770 1290 C 760 1330 800 1420 860 1520 Z"/>
      </g>
      <!-- fingers wrapping around the left edge -->
      <g transform="translate(0,130)">
      <g>
        <ellipse cx="174" cy="1364" rx="34" ry="48.0" fill="rgba(0,0,0,.55)" filter="url(#soft)"/>
        <path d="M 40 1420 C 70 1380, 110 1344, 164 1342 L 170.0 1342" stroke="#4a2619" stroke-width="102" stroke-linecap="round" fill="none"/>
        <path d="M 40 1420 C 70 1380, 110 1344, 164 1342 L 170.0 1342" stroke="url(#fingerG)" stroke-width="96" stroke-linecap="round" fill="none"/>
        <path d="M 70 1368 C 100 1336, 130 1320, 154 1316" stroke="rgba(255,220,195,.22)" stroke-width="21.12" stroke-linecap="round" fill="none"/>
        <path d="M 112 1309.68 C 104 1340, 104 1360, 112 1388.4" stroke="rgba(80,38,24,.45)" stroke-width="4" fill="none" stroke-linecap="round"/>
        <ellipse cx="176" cy="1342" rx="19.200000000000003" ry="28.799999999999997" fill="url(#nail)" stroke="rgba(120,70,55,.5)" stroke-width="2"/>
      </g>
      <g>
        <ellipse cx="192" cy="1249" rx="34" ry="58.0" fill="rgba(0,0,0,.55)" filter="url(#soft)"/>
        <path d="M 40 1305 C 70 1265, 110 1229, 182 1227 L 178.0 1227" stroke="#4a2619" stroke-width="122" stroke-linecap="round" fill="none"/>
        <path d="M 40 1305 C 70 1265, 110 1229, 182 1227 L 178.0 1227" stroke="url(#fingerG)" stroke-width="116" stroke-linecap="round" fill="none"/>
        <path d="M 70 1253 C 100 1221, 130 1205, 172 1201" stroke="rgba(255,220,195,.22)" stroke-width="25.52" stroke-linecap="round" fill="none"/>
        <path d="M 112 1186.28 C 104 1225, 104 1245, 112 1281.4" stroke="rgba(80,38,24,.45)" stroke-width="4" fill="none" stroke-linecap="round"/>
        <ellipse cx="194" cy="1227" rx="23.200000000000003" ry="34.8" fill="url(#nail)" stroke="rgba(120,70,55,.5)" stroke-width="2"/>
      </g>
      <g>
        <ellipse cx="196" cy="1124" rx="34" ry="61.0" fill="rgba(0,0,0,.55)" filter="url(#soft)"/>
        <path d="M 40 1180 C 70 1140, 110 1104, 186 1102 L 179.0 1102" stroke="#4a2619" stroke-width="128" stroke-linecap="round" fill="none"/>
        <path d="M 40 1180 C 70 1140, 110 1104, 186 1102 L 179.0 1102" stroke="url(#fingerG)" stroke-width="122" stroke-linecap="round" fill="none"/>
        <path d="M 70 1128 C 100 1096, 130 1080, 176 1076" stroke="rgba(255,220,195,.22)" stroke-width="26.84" stroke-linecap="round" fill="none"/>
        <path d="M 112 1058.76 C 104 1100, 104 1120, 112 1158.8" stroke="rgba(80,38,24,.45)" stroke-width="4" fill="none" stroke-linecap="round"/>
        <ellipse cx="198" cy="1102" rx="24.400000000000002" ry="36.6" fill="url(#nail)" stroke="rgba(120,70,55,.5)" stroke-width="2"/>
      </g>
      <g>
        <ellipse cx="192" cy="999" rx="34" ry="59.0" fill="rgba(0,0,0,.55)" filter="url(#soft)"/>
        <path d="M 40 1055 C 70 1015, 110 979, 182 977 L 177.0 977" stroke="#4a2619" stroke-width="124" stroke-linecap="round" fill="none"/>
        <path d="M 40 1055 C 70 1015, 110 979, 182 977 L 177.0 977" stroke="url(#fingerG)" stroke-width="118" stroke-linecap="round" fill="none"/>
        <path d="M 70 1003 C 100 971, 130 955, 172 951" stroke="rgba(255,220,195,.22)" stroke-width="25.96" stroke-linecap="round" fill="none"/>
        <path d="M 112 935.44 C 104 975, 104 995, 112 1032.2" stroke="rgba(80,38,24,.45)" stroke-width="4" fill="none" stroke-linecap="round"/>
        <ellipse cx="194" cy="977" rx="23.6" ry="35.4" fill="url(#nail)" stroke="rgba(120,70,55,.5)" stroke-width="2"/>
      </g>
      </g>
      <!-- thumb: from the heel of the hand, over the right edge, pointing up-left -->
      <path d="M 1120 1820 C 1060 1700 980 1560 900 1450 C 860 1395 830 1340 812 1290
               C 800 1255 806 1222 832 1208 C 862 1192 892 1205 912 1235
               C 950 1290 1000 1360 1060 1430 C 1110 1490 1150 1560 1160 1640 Z"
            fill="url(#thumbG)"/>
      <path d="M 822 1250 C 816 1226 826 1210 846 1206 C 870 1202 888 1214 896 1236 C 886 1262 860 1276 840 1272 C 830 1268 824 1260 822 1250 Z"
            fill="url(#nail)" opacity=".9"/>
      <path d="M 900 1300 C 940 1350 980 1400 1040 1470" stroke="rgba(90,45,30,.35)" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M 1090 1400 C 1120 1450 1150 1520 1160 1600" stroke="rgba(214,242,29,.35)" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#soft)"/>
    </svg>
  </div></div></div>
  <div id="vignette"></div>
  <div id="fade"></div>
</div>

<script>
const L1 = "A $100K Trading Challenge.";
const L2 = "Now for Less.";
function words(el, text) {
  el.innerHTML = text.split(" ").map(w => `<span class="w">${w}</span>`).join(" ");
  return [...el.querySelectorAll(".w")];
}
const w1 = words(document.getElementById("l1"), L1);
const w2 = words(document.getElementById("l2"), L2);
const $ = id => document.getElementById(id);

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, t0, d) => clamp((t - t0) / d);
const easeOutCubic = k => 1 - Math.pow(1 - k, 3);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOutExpo = k => k === 1 ? 1 : 1 - Math.pow(2, -10 * k);
// Damped spring 0 -> 1
function spring(k, freq = 4.5, damp = 5.5) {
  if (k <= 0) return 0;
  return 1 - Math.exp(-damp * k) * Math.cos(freq * Math.PI * k);
}

// Timeline (seconds)
const T = {
  rise: 0.0, riseDur: 1.3,
  wake: 1.05,
  notif: 1.45,
  app: 1.7, l1: 1.85, l2: 2.45,
  push: 1.6, pushDur: 3.6,
  sheen: 3.3,
  end: 6.4,
};
window.DURATION = T.end;

window.render = function (t) {
  // Hand + phone rise in from below, settle with a spring.
  const r = spring(prog(t, T.rise, T.riseDur), 1.6, 5);
  const idleX = Math.sin(t * 1.3) * 6, idleY = Math.sin(t * 1.7 + 1) * 8, idleR = Math.sin(t * 1.1) * .5;
  // Haptic buzz when the notification lands
  const bz = prog(t, T.notif, 0.35);
  const buzz = bz > 0 && bz < 1 ? Math.sin(bz * 60) * 5 * (1 - bz) : 0;
  const ty = lerp(1500, 0, r) + idleY;
  const rot = lerp(14, -3, r) + idleR;
  const ry = lerp(-18, -7, r), rx = lerp(18, 6, r);
  $("rig").style.transform =
    `translate(${idleX + buzz}px, ${ty}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rot}deg)`;

  // Screen wakes
  $("wake").style.opacity = 1 - easeOutCubic(prog(t, T.wake, 0.45));

  // Notification drops in from the island
  const n = prog(t, T.notif, 1.0);
  const ns = spring(n, 2.2, 6.5);
  const nScale = lerp(0.35, 1, ns);
  const nY = lerp(-500, 0, ns);
  $("notif").style.transform = `translateY(${nY}px) scale(${nScale})`;
  $("notif").style.opacity = clamp(n * 5);
  $("notif").style.filter = `blur(${lerp(14, 0, clamp(n * 3))}px)`;

  // Clock dims slightly as the notification takes focus
  $("clock").style.opacity = lerp(1, .55, easeInOut(prog(t, T.notif, 1)));

  // Text reveals
  const fadeUp = (el, t0, d = .45, dist = 18) => {
    const k = easeOutCubic(prog(t, t0, d));
    el.style.opacity = k;
    el.style.transform = `translateY(${(1 - k) * dist}px)`;
    el.style.filter = `blur(${(1 - k) * 6}px)`;
  };
  fadeUp($("appName"), T.app); fadeUp($("nowLbl"), T.app + .1);
  w1.forEach((w, i) => fadeUp(w, T.l1 + i * .09, .5, 24));
  w2.forEach((w, i) => {
    const t0 = T.l2 + i * .14;
    const k = prog(t, t0, .55);
    const s = spring(k, 2.4, 6);
    w.style.opacity = clamp(k * 3);
    w.style.transform = `translateY(${(1 - s) * 34}px) scale(${lerp(.7, 1, s)})`;
    w.style.filter = `blur(${(1 - clamp(k * 2.5)) * 8}px)`;
    w.style.textShadow = `0 0 ${lerp(0, 22, clamp(k * 2)) * (1 - .5 * prog(t, t0 + .6, 1))}px rgba(214,242,29,.55)`;
  });

  // Sheen sweep across the card
  const sh = easeInOut(prog(t, T.sheen, .9));
  $("sheen").firstElementChild.style.left = `${lerp(-300, 900, sh)}px`;

  // Camera push-in toward the notification
  const p = easeInOut(prog(t, T.push, T.pushDur));
  const drift = prog(t, T.push + T.pushDur, 2) * .03;
  $("camera").style.transform = `translateY(${lerp(0, 120, p)}px) scale(${lerp(1, 1.42, p) + drift})`;

  // Glow breathes
  const g = .7 + .3 * Math.sin(t * 2.2) ;
  $("glow").style.opacity = (0.35 + .65 * easeOutCubic(prog(t, T.notif, 1))) * g;
  $("glow").style.transform = `scale(${1 + .05 * Math.sin(t * 1.4)})`;
  $("grid").style.transform = `translateY(${-t * 14}px)`;

  // Fade from / to black
  $("fade").style.opacity = Math.max(1 - prog(t, 0, .35), prog(t, T.end - .45, .45));
};
render(Number(new URLSearchParams(location.search).get("t") || 3));
</script>
</body>
</html>
